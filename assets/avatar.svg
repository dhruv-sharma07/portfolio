<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 625" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121727" />
      <stop offset="50%" stop-color="#171d33" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2a63c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6c8cff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2a63c" />
      <stop offset="100%" stop-color="#e08a1f" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c8cff" />
      <stop offset="100%" stop-color="#4a6fdc" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6c8cff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="625" rx="16" fill="url(#bgGrad)" />
  <rect width="500" height="625" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="250" cy="220" r="180" fill="url(#avatarGlow)" />
  
  <!-- Grid Matrix Accents in Background -->
  <g opacity="0.15" stroke="#6c8cff" stroke-width="1">
    <line x1="50" y1="50" x2="450" y2="50" />
    <line x1="50" y1="120" x2="450" y2="120" />
    <line x1="50" y1="190" x2="450" y2="190" />
    <line x1="50" y1="50" x2="50" y2="250" />
    <line x1="150" y1="50" x2="150" y2="250" />
    <line x1="350" y1="50" x2="350" y2="250" />
    <line x1="450" y1="50" x2="450" y2="250" />
  </g>

  <!-- Developer Silhouette / Illustration -->
  <g id="character" filter="url(#softShadow)">
    <!-- Shoulders & Torso (Dark Hoodie / Jacket) -->
    <path d="M 120 540 C 120 440, 160 380, 250 380 C 340 380, 380 440, 380 540 L 390 625 L 110 625 Z" fill="#1e253d" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    
    <!-- Inner Shirt / Collar Accent -->
    <path d="M 215 385 L 250 460 L 285 385 Z" fill="#0a0e1a" stroke="rgba(242,166,60,0.5)" stroke-width="1.5" />
    
    <!-- Laptop Top Glow -->
    <polygon points="160,560 340,560 370,625 130,625" fill="#151b2e" stroke="rgba(108,140,255,0.3)" stroke-width="2" />
    <line x1="175" y1="560" x2="325" y2="560" stroke="#f2a63c" stroke-width="3" stroke-linecap="round" />
    <circle cx="250" cy="585" r="10" fill="#6c8cff" opacity="0.8" />
    
    <!-- Neck -->
    <rect x="225" y="320" width="50" height="70" rx="10" fill="#d4a373" />
    <rect x="225" y="345" width="50" height="45" fill="rgba(0,0,0,0.15)" />

    <!-- Head / Face -->
    <ellipse cx="250" cy="270" rx="72" ry="85" fill="#e0b084" />
    
    <!-- Modern Dark Hair -->
    <path d="M 175 260 C 170 190, 210 150, 250 150 C 300 150, 330 185, 325 260 C 315 220, 290 200, 250 200 C 210 200, 185 225, 175 260 Z" fill="#1b1e2b" />
    <path d="M 180 230 C 195 170, 240 145, 275 145 C 315 145, 335 175, 325 215 C 305 175, 260 170, 220 185 Z" fill="#2d334a" />

    <!-- Modern Smart Glasses -->
    <rect x="195" y="245" width="45" height="30" rx="8" fill="rgba(10, 14, 26, 0.7)" stroke="#6c8cff" stroke-width="3" />
    <rect x="260" y="245" width="45" height="30" rx="8" fill="rgba(10, 14, 26, 0.7)" stroke="#6c8cff" stroke-width="3" />
    <line x1="240" y1="258" x2="260" y2="258" stroke="#6c8cff" stroke-width="3" />
    <line x1="180" y1="255" x2="195" y2="258" stroke="#6c8cff" stroke-width="2.5" />
    <line x1="305" y1="258" x2="320" y2="255" stroke="#6c8cff" stroke-width="2.5" />
    <!-- Glass Reflections -->
    <line x1="202" y1="250" x2="225" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />
    <line x1="267" y1="250" x2="290" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />

    <!-- Confident Smile -->
    <path d="M 235 315 Q 250 328 265 315" fill="none" stroke="#874e2d" stroke-width="3" stroke-linecap="round" />

    <!-- Over-Ear Headset (Tech Vibe) -->
    <path d="M 172 260 C 160 210, 195 135, 250 135 C 305 135, 340 210, 328 260" fill="none" stroke="#333d59" stroke-width="12" stroke-linecap="round" />
    <rect x="162" y="240" width="18" height="48" rx="8" fill="#f2a63c" stroke="#121727" stroke-width="2" />
    <rect x="320" y="240" width="18" height="48" rx="8" fill="#f2a63c" stroke="#121727" stroke-width="2" />
  </g>

  <!-- Floating UI Code Snippet Badge -->
  <g transform="translate(40, 75)">
    <rect width="130" height="44" rx="8" fill="#121727" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <circle cx="16" cy="22" r="5" fill="#57d18f" />
    <text x="30" y="26" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#e9ebf2">AI Engineer</text>
  </g>

  <!-- Floating Tech Badge -->
  <g transform="translate(320, 110)">
    <rect width="140" height="44" rx="8" fill="#121727" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <circle cx="18" cy="22" r="5" fill="#f2a63c" />
    <text x="32" y="26" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#e9ebf2">Full-Stack</text>
  </g>
</svg>